name: Frontend Building

description: Build Next.js frontend

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/dashboard/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: frontend/dashboard
      run: npm install --legacy-peer-deps -D \
            jest \
            ts-jest \
            jest-environment-jsdom \
            @types/jest \
            @testing-library/react \
            @testing-library/dom \
            @testing-library/jest-dom \
            @testing-library/user-event

    - name: Build
      shell: bash
      working-directory: frontend/dashboard
      run: npm run build