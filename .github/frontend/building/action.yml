name: Frontend Build

description: Build NextJS frontend

runs:
  using: composite

  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      shell: bash
      working-directory: frontend/dashboard
      run: npm ci

    - name: Build frontend
      shell: bash
      working-directory: frontend/dashboard
      run: npm run build